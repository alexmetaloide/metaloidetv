name: Publish Beta 8 APK

on:
  push:
    paths:
      - '.github/workflows/publish-beta8.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Beta 8 artifact
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-23d0-820e-97f2-c4670bf96588/raw?se=2026-10-05T22%3A44%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=b00f9871-1d1b-5abd-8cdd-3135dbfc3b8f&skoid=9fcafdab-1a9a-48a1-833e-6f0dce81fc66&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T10%3A23%3A02Z&ske=2026-10-06T10%3A23%3A02Z&sks=b&skv=2026-02-06&sig=7ZvQXMVRvup9LgLLAngJXzf7QUCRaXwPw/55fq8paOM%3D' -o artifact.zip
          unzip -j artifact.zip app-debug.apk -d .
          cp app-debug.apk Metalloide-IPTV-Android-0.2.2-beta.8.apk
          cp app-debug.apk Metalloide-IPTV-Android-0.2.2-beta.7.apk
          rm app-debug.apk artifact.zip

      - name: Publish APK files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Metalloide-IPTV-Android-0.2.2-beta.8.apk Metalloide-IPTV-Android-0.2.2-beta.7.apk
          git commit -m "Publish Android 0.2.2 Beta 8 fullscreen update"
          git push
