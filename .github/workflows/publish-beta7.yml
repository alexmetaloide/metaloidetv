name: Publish Beta 7 APK

on:
  push:
    paths:
      - '.github/workflows/publish-beta7.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Beta 7 artifact
        run: |
          curl -fL 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-93d4-820e-8f63-7c07ad84acc1/raw?se=2026-10-05T22%3A21%3A41Z&sp=r&sv=2026-02-06&sr=b&scid=bb8027cb-9a3a-5a7e-8c58-f53cfb869e72&skoid=9fcafdab-1a9a-48a1-833e-6f0dce81fc66&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T11%3A30%3A29Z&ske=2026-10-06T11%3A30%3A29Z&sks=b&skv=2026-02-06&sig=QEMC9jtPpjJH4ZsmXPuqg6LiIVDzmdyQHZe0JoB4eUY%3D' -o artifact.zip
          unzip -j artifact.zip app-debug.apk -d .
          mv app-debug.apk Metalloide-IPTV-Android-0.2.2-beta.7.apk

      - name: Commit public APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Metalloide-IPTV-Android-0.2.2-beta.7.apk
          git commit -m "Publish Android 0.2.2 Beta 7 APK"
          git push
